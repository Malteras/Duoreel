<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick Tonight FAB Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom right, #020617, #0f172a, #020617);
    color: #e2e8f0;
    min-height: 100vh;
    max-width: 390px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    padding: 12px 16px;
  }
  .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
  .header .subtitle { font-size: 12px; color: #94a3b8; margin-top: 2px; }

  /* Tab bar */
  .tabs {
    display: flex; gap: 4px;
    padding: 8px 16px;
    background: rgba(15, 23, 42, 0.8);
  }
  .tab {
    flex: 1; text-align: center; padding: 8px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #94a3b8;
    background: transparent; border: none; cursor: pointer;
  }
  .tab.active {
    background: #db2777; color: #fff;
  }

  /* Movie grid */
  .grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 16px;
  }
  .card {
    background: linear-gradient(to bottom, rgba(30,41,59,0.5), rgba(15,23,42,0.8));
    border: 1px solid rgba(51,65,85,0.5);
    border-radius: 12px; overflow: hidden;
  }
  .card-img {
    width: 100%; aspect-ratio: 2/3;
    background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%);
    display: flex; align-items: center; justify-content: center;
    color: #475569; font-size: 11px;
  }
  .card-info { padding: 8px; }
  .card-title { font-size: 12px; font-weight: 600; color: #fff; line-height: 1.3; }
  .card-year { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .match-badge {
    display: inline-block; background: #be185d; color: #fff;
    font-size: 9px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; margin-top: 4px;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(51, 65, 85, 0.5);
    display: flex; justify-content: space-around;
    padding: 8px 0 20px;
    z-index: 50;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; color: #64748b;
  }
  .nav-item.active { color: #db2777; }
  .nav-icon { width: 20px; height: 20px; border-radius: 4px; background: currentColor; opacity: 0.5; }
  .nav-item.active .nav-icon { opacity: 1; }

  /* === FABs === */
  .fab-stack {
    position: fixed;
    bottom: 80px;
    right: 16px;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }

  .fab {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600;
    padding: 12px 18px;
    border-radius: 9999px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.95); }

  .fab-filters {
    background: #1e293b;
    border: 1px solid #475569;
    color: #fff;
  }

  .fab-pick {
    background: linear-gradient(135deg, #db2777, #9333ea);
    color: #fff;
    border: none;
  }

  .fab svg {
    width: 18px; height: 18px; flex-shrink: 0;
  }

  /* Option labels */
  .option-label {
    position: fixed;
    top: 12px; right: 12px;
    background: #1e293b;
    border: 1px solid #475569;
    color: #94a3b8;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    z-index: 60;
  }
</style>
</head>
<body>

<div class="option-label">Matches Tab — Mobile</div>

<!-- Header -->
<div class="header">
  <h1>Matches</h1>
  <div class="subtitle">12 movies you both liked</div>
</div>

<!-- Movie grid -->
<div class="grid">
  <div class="card">
    <div class="card-img">Poster</div>
    <div class="card-info">
      <div class="card-title">Dune: Part Two</div>

  </div>
  <div class="card">

    <div class="card-info">
      <div class="card-title">The Holdovers</div>
      <div class="card-year">2023</div>
      <div class="match-badge">MATCH</div>
    </div>
  </div>
  <div class="card">
    <div class="card-img">Poster</div>
    <div class="card-info">
      <div class="card-title">Past Lives</div>
      <div class="card-year">2023</div>
      <div class="match-badge">MATCH</div>
    </div>
  </div>
  <div class="card">
    <div class="card-img">Poster</div>
    <div class="card-info">
      <div class="card-title">Oppenheimer</div>
      <div class="card-year">2023</div>
      <div class="match-badge">MATCH</div>
    </div>
  </div>
  <div class="card">
    <div class="card-img">Poster</div>
    <div class="card-info">
      <div class="card-title">Anatomy of a Fall</div>
      <div class="card-year">2023</div>
      <div class="match-badge">MATCH</div>
    </div>
  </div>
  <div class="card">
    <div class="card-img">Poster</div>

      <div class="card-title">Poor Things</div>

<!-- FAB Stack -->
<div class="fab-stack">
  <!-- Filters FAB (existing) -->
  <button class="fab fab-filters">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
      <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
      <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
      <line x1="17" y1="16" x2="23" y2="16"/>
    </svg>
    Filters
  </button>

  <!-- Pick Tonight FAB (new) -->
  <button class="fab fab-pick">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
    </svg>
    Pick Tonight
  </button>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <div class="nav-item">
    <div class="nav-icon"></div>
    Discover
  </div>
  <div class="nav-item">
    <div class="nav-icon"></div>
    Saved
  </div>
  <div class="nav-item active">
    <div class="nav-icon"></div>
    Matches
  </div>
  <div class="nav-item">
    <div class="nav-icon"></div>
    Profile
  </div>
</div>

</body>
</html>
